# yaml-language-server: $schema=../schema.json
# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # The Caddy of op terminates TLS for rp.localhost and passes the request on over HTTP: without the scheme
    # it forwards, the callback this application sends as "redirect_uri" would start with http://, and the
    # provider compares a redirect URI byte for byte.
    trusted_proxies: 'PRIVATE_SUBNETS'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto']

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
