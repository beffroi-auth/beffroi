# The whole site asks for a login while it is not public. config/htpasswd is written at build time from the
# HTPASSWD_CONTENT environment variable (composer.json, extra.paas.compile), and a build without it fails.
#
# Except the webhook of Sweego, which cannot log in and signs what it sends instead (config/packages/webhook.yaml). The
# realm is a variable because a location would not do: try_files hands the request to /index.php, whose location
# inherits the login of the server. $request_uri keeps the URI as the client sent it, dot segments included, hence a
# match on the whole path and nothing shorter: "/webhook/../" would otherwise reach any file of public/.
set $beffroi_realm "Beffroi";
if ($request_uri ~ ^/webhook/sweego(\?|$)) {
    set $beffroi_realm off;
}
auth_basic $beffroi_realm;
auth_basic_user_file /app/config/htpasswd;
