framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            - assets/
        missing_import_mode: strict

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn

# The stylesheet is not built for the suite (issue beffroi-auth/beffroi#521), and symfonycasts/tailwind-bundle
# is the one that decides so: it leaves its strict mode off in the test environment, so the input CSS is
# served as it is written rather than as the binary built it. What it is written with is "@import
# "tailwindcss"", an import no asset of this application answers, which is an error under "strict" and what
# every page would then fail on. What the suite reads of a page is its markup; downloading a binary and
# building a stylesheet to assert nothing about it would be the cost of a page nobody looks at.
when@test:
    framework:
        asset_mapper:
            missing_import_mode: ignore
