# Split configuration for jderusse/gitsplit. Each directory below is mirrored, read only, into
# its own repository: the packages of the identity provider, its SAML module among them, the
# SAML packages, and the standalone application, which is deployed from a build of apps/op and
# never installed as a dependency. A mirror carries the maintained branches and the release tags
# listed under origins, and nothing else; the monorepo is where the work happens.
#
# The tag pattern is the one laminas/automatic-releases writes when a version milestone is
# closed: the milestone title itself, without a "v".
#
# There is no cache_url, and there must not be one while the monorepo is private. With a cache
# url, gitsplit keeps a persistent cache repository and updates it from origin before every
# run; the container holds no credential for origin and the run dies on "could not read
# Username for https://github.com". Without one it builds a temporary repository from the
# objects of the working copy, and the fetch of origin is a warning it walks past.

splits:
  - prefix: "src/core"
    target: "https://${GH_TOKEN}@github.com/beffroi-auth/core.git"
  - prefix: "src/oidc"
    target: "https://${GH_TOKEN}@github.com/beffroi-auth/oidc.git"
  - prefix: "src/symfony"
    target: "https://${GH_TOKEN}@github.com/beffroi-auth/symfony-bundle.git"
  - prefix: "src/xml-security"
    target: "https://${GH_TOKEN}@github.com/beffroi-auth/xml-security.git"
  - prefix: "src/saml2-model"
    target: "https://${GH_TOKEN}@github.com/beffroi-auth/saml2-model.git"
  - prefix: "src/saml2-bindings"
    target: "https://${GH_TOKEN}@github.com/beffroi-auth/saml2-bindings.git"
  - prefix: "src/saml"
    target: "https://${GH_TOKEN}@github.com/beffroi-auth/saml.git"
  - prefix: "apps/op"
    target: "https://${GH_TOKEN}@github.com/beffroi-auth/op.git"

origins:
  - ^\d+\.\d+\.x$
  - ^\d+\.\d+\.\d+$
