# Layers of docs/11-architecture.md §2: four layers in each pure-PHP package of the identity provider.
# The identity core never depends on a protocol; protocols never depend on each other;
# nothing below the bundle knows Symfony's HTTP, DI or Doctrine.
deptrac:
  paths:
    - '../src'
  layers:
    - name: 'CoreDomain'
      collectors:
        - { type: directory, value: '../src/core/src/Domain/.*' }
        - { type: directory, value: '../src/core/src/Exception/.*' }
    - name: 'CorePort'
      collectors:
        - { type: directory, value: '../src/core/src/Port/.*' }
    - name: 'CoreApplication'
      collectors:
        - { type: directory, value: '../src/core/src/Application/.*' }
    - name: 'CoreBridge'
      collectors:
        - { type: directory, value: '../src/core/src/Bridge/.*' }
    - name: 'OidcDomain'
      collectors:
        - { type: directory, value: '../src/oidc/src/Domain/.*' }
        - { type: directory, value: '../src/oidc/src/Exception/.*' }
    - name: 'OidcPort'
      collectors:
        - { type: directory, value: '../src/oidc/src/Port/.*' }
    - name: 'OidcApplication'
      collectors:
        - { type: directory, value: '../src/oidc/src/Application/.*' }
    - name: 'OidcBridge'
      collectors:
        - { type: directory, value: '../src/oidc/src/Bridge/.*' }
    # beffroi/saml (decision 0013, src/saml/spec/saml.md section 2), the SAML module, at the level of beffroi/oidc: the
    # same four layers, and nothing of the other protocol either way.
    - name: 'SamlDomain'
      collectors:
        - { type: directory, value: '../src/saml/src/Domain/.*' }
        - { type: directory, value: '../src/saml/src/Exception/.*' }
    - name: 'SamlPort'
      collectors:
        - { type: directory, value: '../src/saml/src/Port/.*' }
    - name: 'SamlApplication'
      collectors:
        - { type: directory, value: '../src/saml/src/Application/.*' }
    - name: 'SamlBridge'
      collectors:
        - { type: directory, value: '../src/saml/src/Bridge/.*' }
    - name: 'Bundle'
      collectors:
        - { type: directory, value: '../src/symfony/.*' }
    # psr/clock is a layer of its own, apart from the other PSR interfaces, because saml2-model may read the time
    # through it and may not speak HTTP through Psr\Http; every layer that may use the one may use the other.
    - name: 'Psr'
      collectors:
        - { type: classLike, value: '^Psr\\(?!Clock\\)' }
    - name: 'PsrClock'
      collectors:
        - { type: classLike, value: '^Psr\\Clock\\' }
    - name: 'KeyManagement'
      collectors:
        - { type: classLike, value: '^Symfony\\Component\\KeyManagement\\(?!Bridge\\Doctrine)' }
    # The two Doctrine bridges of the component are a layer of their own, and only the bundle may see it:
    # they carry a DBAL type, a DBAL table and an ORM listener, which is exactly what the core and the
    # module are forbidden. Everything else of the component stays in the layer above, which the core's
    # Bridge reads to seal a key and a secret.
    - name: 'KeyManagementDoctrine'
      collectors:
        - { type: classLike, value: '^Symfony\\Component\\KeyManagement\\Bridge\\Doctrine' }
    - name: 'Uid'
      collectors:
        - { type: classLike, value: '^Symfony\\Component\\Uid\\' }
    - name: 'Jose'
      collectors:
        - { type: classLike, value: '^Jose\\' }
    - name: 'Webauthn'
      collectors:
        # webauthn-lib and cose-lib, the WebAuthn brick (docs/09-briques.md): the core reads its records and authenticator data, parses nothing; its Bridge runs the ceremonies on it
        - { type: classLike, value: '^Webauthn\\' }
        - { type: classLike, value: '^Cose\\' }
    - name: 'Pki'
      collectors:
        # spomky-labs/pki-framework, the X.509 brick (docs/09-briques.md): the Bridge of the protocol reads a client certificate with it, nothing else parses ASN.1
        - { type: classLike, value: '^SpomkyLabs\\Pki\\' }
    - name: 'Otphp'
      collectors:
        # spomky-labs/otphp and its base32, the TOTP brick (docs/09-briques.md): the Bridge of the core computes the codes and the provisioning URI on it, the core reads the steps
        - { type: classLike, value: '^OTPHP\\' }
        - { type: classLike, value: '^ParagonIE\\ConstantTime\\' }
    - name: 'WebPush'
      collectors:
        # spomky-labs/web-push-lib, the Web Push brick (docs/09-briques.md): the bundle encrypts a
        # notification to a browser and signs the request with it, nothing else speaks RFC 8291
        - { type: classLike, value: '^WebPush\\' }
    - name: 'MaxMindDb'
      collectors:
        # maxmind-db/reader, the brick that reads a GeoLite2 database (docs/09-briques.md): the bundle
        # reads the place of an address with it, and the reader alone, so that nothing of this provider
        # holds a client that would send an address to MaxMind (issue #473, decision 0006)
        - { type: classLike, value: '^MaxMind\\' }
    - name: 'QrCode'
      collectors:
        # bacon/bacon-qr-code, what draws the QR code of a TOTP enrolment as an SVG in the bundle (architecture §5.2): the pages embed it, nothing else reads it
        - { type: classLike, value: '^BaconQrCode\\' }
    - name: 'Serializer'
      collectors:
        # The serializer webauthn-lib reads the responses of the browser with and writes the options for it; a dependency of the brick, used by the Bridge of the core only through it
        - { type: classLike, value: '^Symfony\\Component\\Serializer\\' }
    - name: 'Symfony'
      collectors:
        # Everything of Symfony except the standalone components the pure-PHP packages may use, which have layers of their own above
        - { type: classLike, value: '^Symfony\\(?!Component\\(?:Uid|KeyManagement|Serializer)\\)' }
    - name: 'Doctrine'
      collectors:
        - { type: classLike, value: '^Doctrine\\' }
    - name: 'Twig'
      collectors:
        - { type: classLike, value: '^Twig\\' }
    # The SAML packages, which know nothing of the identity provider's and are known by beffroi/saml alone, through
    # their public layers.
    # beffroi/xml-security (decision 0014): Dsig and Enc depend on Core, never the reverse and never on each other,
    # Core on nothing of the package. Each namespace is two layers, its Internal one apart, so that saml2-model below
    # is held to the public classes; within the package the split changes nothing, an Internal layer and the public
    # one of the same namespace allowing each other.
    - name: 'XmlCore'
      collectors:
        - { type: classLike, value: '^Beffroi\\Xml\\Core\\(?!Internal\\)' }
    - name: 'XmlCoreInternal'
      collectors:
        - { type: classLike, value: '^Beffroi\\Xml\\Core\\Internal\\' }
    - name: 'XmlDsig'
      collectors:
        - { type: classLike, value: '^Beffroi\\Xml\\Dsig\\(?!Internal\\)' }
    - name: 'XmlDsigInternal'
      collectors:
        - { type: classLike, value: '^Beffroi\\Xml\\Dsig\\Internal\\' }
    - name: 'XmlEnc'
      collectors:
        - { type: classLike, value: '^Beffroi\\Xml\\Enc\\(?!Internal\\)' }
    - name: 'XmlEncInternal'
      collectors:
        - { type: classLike, value: '^Beffroi\\Xml\\Enc\\Internal\\' }
    # beffroi/saml2-model (section 10 of spec/model.md): Value below Assertion, Protocol and Metadata, those below
    # Validation and Writing; Port beside, Exception and the two classes of the root (Saml, SamlLoader) under all of
    # them; Internal, the strict readers, the selection of the signed element and the decryption of an encrypted
    # assertion, between the objects it builds and the validators that call it. Outside the package, the public classes
    # of Core and Dsig and psr/clock where the specification uses them, and the public classes of Enc for Writing, whose
    # response writer encrypts the assertion for the service provider that asks for it, and for Validation and
    # Internal, where the response validator decrypts one with the key of the service provider (section 6.7). What is
    # forbidden is a layer no rule allows: the Internal namespaces of xml-security, and HTTP (decision 0013), which is
    # in the Symfony and Psr layers above.
    - name: 'Saml2ModelRoot'
      collectors:
        - { type: classLike, value: '^Beffroi\\Saml2\\Model\\[^\\]+$' }
    - name: 'Saml2ModelException'
      collectors:
        - { type: classLike, value: '^Beffroi\\Saml2\\Model\\Exception\\' }
    - name: 'Saml2ModelValue'
      collectors:
        - { type: classLike, value: '^Beffroi\\Saml2\\Model\\Value\\' }
    - name: 'Saml2ModelPort'
      collectors:
        - { type: classLike, value: '^Beffroi\\Saml2\\Model\\Port\\' }
    - name: 'Saml2ModelAssertion'
      collectors:
        - { type: classLike, value: '^Beffroi\\Saml2\\Model\\Assertion\\' }
    - name: 'Saml2ModelProtocol'
      collectors:
        - { type: classLike, value: '^Beffroi\\Saml2\\Model\\Protocol\\' }
    - name: 'Saml2ModelMetadata'
      collectors:
        - { type: classLike, value: '^Beffroi\\Saml2\\Model\\Metadata\\' }
    # TimeBounds is a value of Validation that MetadataReader takes too (section 5.6): a leaf of its own, so that
    # Metadata uses it without depending on the validators.
    - name: 'Saml2ModelTimeBounds'
      collectors:
        - { type: classLike, value: '^Beffroi\\Saml2\\Model\\Validation\\TimeBounds$' }
    # Authentication is a value of Validation that the rule of M-2 under Internal returns too (section 5.6): a leaf of
    # its own, so that Internal names it without depending on the validators.
    - name: 'Saml2ModelAuthentication'
      collectors:
        - { type: classLike, value: '^Beffroi\\Saml2\\Model\\Validation\\Authentication$' }
    - name: 'Saml2ModelValidation'
      collectors:
        - { type: classLike, value: '^Beffroi\\Saml2\\Model\\Validation\\(?!TimeBounds$|Authentication$)' }
    - name: 'Saml2ModelWriting'
      collectors:
        - { type: classLike, value: '^Beffroi\\Saml2\\Model\\Writing\\' }
    - name: 'Saml2ModelInternal'
      collectors:
        - { type: classLike, value: '^Beffroi\\Saml2\\Model\\Internal\\' }
    # beffroi/saml2-bindings (section 10 of spec/bindings.md): Internal below the public classes, Exception beside
    # them. Outside the package, the public classes of saml2-model (section 6.5), each of its layers above but its
    # Internal one, and those of Core and Dsig (section 6.6). What is forbidden is a layer no rule allows: the Internal
    # namespace of saml2-model, the Internal namespaces of xml-security, its Enc namespace (section 11), and HTTP
    # (B-13, decisions 0007 and 0013), which is in the Symfony and Psr layers above.
    - name: 'Saml2BindingsPublic'
      collectors:
        - { type: classLike, value: '^Beffroi\\Saml2\\Bindings\\[^\\]+$' }
    - name: 'Saml2BindingsException'
      collectors:
        - { type: classLike, value: '^Beffroi\\Saml2\\Bindings\\Exception\\' }
    - name: 'Saml2BindingsInternal'
      collectors:
        - { type: classLike, value: '^Beffroi\\Saml2\\Bindings\\Internal\\' }
  ruleset:
    CoreDomain:
      - 'Psr'
      - 'PsrClock'
      - 'Uid'
      - 'Webauthn'
    CorePort:
      - 'CoreDomain'
      - 'Psr'
      - 'PsrClock'
      - 'Uid'
      - 'Webauthn'
    CoreApplication:
      - 'CoreDomain'
      - 'CorePort'
      - 'Psr'
      - 'PsrClock'
      - 'Uid'
      - 'Webauthn'
    CoreBridge:
      - 'CoreDomain'
      - 'CorePort'
      - 'CoreApplication'
      - 'Psr'
      - 'PsrClock'
      - 'KeyManagement'
      - 'Uid'
      - 'Jose'
      - 'Webauthn'
      - 'Otphp'
      - 'Serializer'
    OidcDomain:
      - 'CoreDomain'
      - 'Psr'
      - 'PsrClock'
      - 'Uid'
    OidcPort:
      - 'OidcDomain'
      - 'CoreDomain'
      - 'CorePort'
      - 'Psr'
      - 'PsrClock'
      - 'Uid'
    OidcApplication:
      - 'OidcDomain'
      - 'OidcPort'
      - 'CoreDomain'
      - 'CorePort'
      - 'CoreApplication'
      - 'Psr'
      - 'PsrClock'
      - 'Uid'
    OidcBridge:
      - 'OidcDomain'
      - 'OidcPort'
      - 'OidcApplication'
      - 'CoreDomain'
      - 'CorePort'
      - 'Psr'
      - 'PsrClock'
      - 'Jose'
      - 'Pki'
      - 'Uid'
    SamlDomain:
      - 'CoreDomain'
      - 'Psr'
      - 'PsrClock'
      - 'Uid'
    SamlPort:
      - 'SamlDomain'
      - 'CoreDomain'
      - 'CorePort'
      - 'Psr'
      - 'PsrClock'
      - 'Uid'
    SamlApplication:
      - 'SamlDomain'
      - 'SamlPort'
      - 'CoreDomain'
      - 'CorePort'
      - 'CoreApplication'
      - 'Psr'
      - 'PsrClock'
      - 'Uid'
    # The SAML stack is a brick of the module, as JOSE is of beffroi/oidc: its Bridge implements the ports on it, and
    # sees each public layer of saml2-model, saml2-bindings and xml-security, never one of their Internal namespaces;
    # Enc for the key of the service provider an assertion is encrypted for and the scheme it is encrypted under, which
    # it hands the model's writer (spec/saml.md S-19, S-20, issue #733); pki-framework for the self-signed certificate
    # around a tenant's key (decision 0013).
    SamlBridge:
      - 'SamlDomain'
      - 'SamlPort'
      - 'SamlApplication'
      - 'CoreDomain'
      - 'CorePort'
      - 'Psr'
      - 'PsrClock'
      - 'Pki'
      - 'Uid'
      - 'Saml2ModelRoot'
      - 'Saml2ModelException'
      - 'Saml2ModelValue'
      - 'Saml2ModelPort'
      - 'Saml2ModelAssertion'
      - 'Saml2ModelProtocol'
      - 'Saml2ModelMetadata'
      - 'Saml2ModelTimeBounds'
      - 'Saml2ModelAuthentication'
      - 'Saml2ModelValidation'
      - 'Saml2ModelWriting'
      - 'Saml2BindingsPublic'
      - 'Saml2BindingsException'
      - 'XmlCore'
      - 'XmlDsig'
      - 'XmlEnc'
    Bundle:
      - 'CoreDomain'
      - 'CorePort'
      - 'CoreApplication'
      - 'CoreBridge'
      - 'OidcDomain'
      - 'OidcPort'
      - 'OidcApplication'
      - 'OidcBridge'
      # beffroi/saml, which the bundle wires and serves the routes of (spec/saml.md section 2): its four layers, never
      # the SAML stack under them, which is the Bridge's
      - 'SamlDomain'
      - 'SamlPort'
      - 'SamlApplication'
      - 'SamlBridge'
      - 'Psr'
      - 'PsrClock'
      - 'Symfony'
      - 'KeyManagement'
      - 'KeyManagementDoctrine'
      - 'Uid'
      - 'Jose'
      - 'Webauthn'
      - 'Otphp'
      - 'WebPush'
      - 'MaxMindDb'
      - 'QrCode'
      - 'Serializer'
      - 'Doctrine'
      - 'Twig'
    XmlCore: ['XmlCoreInternal']
    XmlCoreInternal: ['XmlCore']
    XmlDsig: ['XmlCore', 'XmlCoreInternal', 'XmlDsigInternal']
    XmlDsigInternal: ['XmlCore', 'XmlCoreInternal', 'XmlDsig']
    XmlEnc: ['XmlCore', 'XmlCoreInternal', 'XmlEncInternal']
    XmlEncInternal: ['XmlCore', 'XmlCoreInternal', 'XmlEnc']
    Saml2ModelRoot: ['XmlCore']
    Saml2ModelException: ['XmlCore', 'Saml2ModelProtocol']
    Saml2ModelValue: ['Saml2ModelRoot', 'Saml2ModelException', 'XmlCore']
    Saml2ModelPort: ~
    Saml2ModelTimeBounds: ~
    Saml2ModelAuthentication: ~
    Saml2ModelAssertion: ['Saml2ModelRoot', 'Saml2ModelException', 'Saml2ModelValue', 'XmlCore']
    Saml2ModelProtocol: ['Saml2ModelRoot', 'Saml2ModelException', 'Saml2ModelValue', 'Saml2ModelAssertion', 'Saml2ModelInternal', 'XmlCore']
    # IdentityProvider carries the service provider's decryption key given to that provider, Enc's port (model.md 5.5)
    Saml2ModelMetadata: ['Saml2ModelRoot', 'Saml2ModelException', 'Saml2ModelValue', 'Saml2ModelAssertion', 'Saml2ModelInternal', 'Saml2ModelTimeBounds', 'XmlCore', 'XmlDsig', 'XmlEnc', 'PsrClock']
    Saml2ModelInternal: ['Saml2ModelRoot', 'Saml2ModelException', 'Saml2ModelValue', 'Saml2ModelAssertion', 'Saml2ModelProtocol', 'Saml2ModelMetadata', 'Saml2ModelTimeBounds', 'Saml2ModelAuthentication', 'XmlCore', 'XmlDsig', 'XmlEnc']
    Saml2ModelValidation: ['Saml2ModelRoot', 'Saml2ModelException', 'Saml2ModelValue', 'Saml2ModelAssertion', 'Saml2ModelProtocol', 'Saml2ModelMetadata', 'Saml2ModelPort', 'Saml2ModelTimeBounds', 'Saml2ModelAuthentication', 'Saml2ModelInternal', 'XmlCore', 'XmlDsig', 'XmlEnc', 'PsrClock']
    Saml2ModelWriting: ['Saml2ModelRoot', 'Saml2ModelException', 'Saml2ModelValue', 'Saml2ModelAssertion', 'Saml2ModelProtocol', 'Saml2ModelMetadata', 'Saml2ModelInternal', 'XmlCore', 'XmlDsig', 'XmlEnc']
    Saml2BindingsPublic: ['Saml2BindingsException', 'Saml2BindingsInternal', 'Saml2ModelRoot', 'Saml2ModelException', 'Saml2ModelValue', 'Saml2ModelPort', 'Saml2ModelAssertion', 'Saml2ModelProtocol', 'Saml2ModelMetadata', 'Saml2ModelTimeBounds', 'Saml2ModelAuthentication', 'Saml2ModelValidation', 'Saml2ModelWriting', 'XmlCore', 'XmlDsig']
    # BindingRefused extends the RefusedXml of Core (section 5.4)
    Saml2BindingsException: ['XmlCore']
    Saml2BindingsInternal: ['Saml2BindingsException', 'Saml2ModelRoot', 'Saml2ModelException', 'Saml2ModelValue', 'Saml2ModelPort', 'Saml2ModelAssertion', 'Saml2ModelProtocol', 'Saml2ModelMetadata', 'Saml2ModelTimeBounds', 'Saml2ModelAuthentication', 'Saml2ModelValidation', 'Saml2ModelWriting', 'XmlCore', 'XmlDsig']
