# Development stack of the monorepo.
#
#   docker compose up -d                          the OP on https://op.localhost and PostgreSQL
#                                                 plus https://mtls.op.localhost, which asks for a client certificate
#   docker compose --profile conformance up -d    plus the OpenID conformance suite on https://localhost:8443
#   docker compose --profile vault up -d          plus HashiCorp Vault (dev mode), whose Transit engine seals the signing keys
#   docker compose --profile aws up -d            plus LocalStack (KMS only), an AWS KMS on the desk that seals them the same way
#   docker compose --profile rp up -d             plus the relying party of apps/rp on https://rp.localhost (castor rp)
#
# The OP answers on op.localhost for the browser (every *.localhost name is loopback) and for the
# conformance suite container (network alias). Caddy issues the certificate from its internal CA;
# that CA is imported into the Java truststore of the suite at start-up (tests/conformance/server-entrypoint.sh),
# with the certificate of the suite's own nginx, for the scripted browser of the suite (tests/conformance/README.md).
services:
  op:
    build:
      context: .
      dockerfile: apps/op/Dockerfile
      target: frankenphp_dev
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-op.localhost}
      # The second host, the one that asks for a client certificate (issue #157, architecture §6):
      # the same listener, another name, and the site block of apps/op/frankenphp/mtls.Caddyfile, imported
      # the way worker.Caddyfile is. The host of SERVER_NAME above is untouched and keeps asking for nothing.
      MTLS_SERVER_NAME: ${MTLS_SERVER_NAME:-mtls.op.localhost}
      # The relying party of apps/rp, rp.localhost, is a site of this listener as well: docker/rp/rp.Caddyfile,
      # mounted below rather than built into the image, being a site of the stack and not of the application.
      CADDY_EXTRA_CONFIG: |-
        import mtls.Caddyfile
        import rp.Caddyfile
      DATABASE_URL: postgresql://${POSTGRES_USER:-beffroi}:${POSTGRES_PASSWORD:-beffroi}@database:5432/${POSTGRES_DB:-beffroi}?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-beffroi}:${RABBITMQ_PASSWORD:-beffroi}@rabbitmq:5672/%2f/messages
      # https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      # Both documented in apps/op/.env; "castor start --conformance" sets them for a stack that serves the suite.
      APP_PROFILER: ${APP_PROFILER:-1}
      CONFORMANCE_ACCESS_TOKEN_FORMAT: ${CONFORMANCE_ACCESS_TOKEN_FORMAT:-jwt}
      # The name the suite's nginx answers on, set by "castor start --conformance" and by nothing else:
      # it is what tells the entrypoint that there is a certificate to trust (docker/conformance/trust-nginx.sh).
      CONFORMANCE_NGINX_HOST: ${CONFORMANCE_NGINX_HOST:-}
      # Worker mode, as in production (architecture §3.3, §6): the kernel, and with it the opened signing key,
      # lives for every request a worker serves; the KMS is asked once per key and per worker, not once per
      # signature. The workers restart when a source file of the application or of the packages changes,
      # .env.local included ("castor provision" writes it after the first start, and a worker reads it once);
      # never on a write under var/, or every compiled template and catalogue would restart them.
      FRANKENPHP_CONFIG: "import worker.Caddyfile"
      FRANKENPHP_WORKER_CONFIG: |-
        watch /app/src/**/*.php
        watch /app/config/**/*.{php,yaml,yml}
        watch /app/templates/**/*.twig
        watch /app/translations/**/*.xlf
        watch /app/.env*
        watch /src/**/*.{php,yaml,yml,twig,xlf}
    # What this container needs from the machine around it before the image sets the application up: the
    # certificate of the conformance suite when the suite is up. It runs in front of docker-entrypoint and
    # ends in it, the other way round from the worker, because everything that entrypoint does for this
    # container it only does when the command it is given starts with "frankenphp".
    entrypoint: ["/bin/sh", "/entrypoint/entrypoint.sh"]
    # Naming an entrypoint clears the command of the image, so the command of the development image is
    # said again here. Without it docker-entrypoint is handed nothing, and everything it does for this
    # container it only does when what it is handed starts with "frankenphp": the container comes up with
    # no application in it and goes unhealthy.
    command: ["frankenphp", "run", "--config", "/etc/frankenphp/Caddyfile", "--watch"]
    # The check of the image, whose sixty seconds are what this container takes to install, migrate and
    # build its stylesheet. Under "--conformance" the entrypoint waits for the certificate of the suite's
    # nginx before any of that, and the suite starts after this container: the window is wide enough for
    # that wait, or "up --wait" would call an OP that is still getting ready unhealthy. The test is
    # repeated because a healthcheck without one is not an override of the image's, it is no check.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2019/metrics || exit 1"]
      start_period: 120s
    volumes:
      - ./docker/op/entrypoint.sh:/entrypoint/entrypoint.sh:ro
      - ./docker/conformance/trust-nginx.sh:/entrypoint/trust-nginx.sh:ro
      - ./docker/rp/rp.Caddyfile:/etc/frankenphp/rp.Caddyfile:ro
      - ./apps/op:/app
      - ./src:/src
      - /app/var/
      # The sealed signing keys are files (architecture §3.3): the process that serves them and the process
      # that rotates them (the worker below) share the directory, or a rotation would change nothing here.
      - keys_data:/app/var/keys
      # The key of the file backend ("castor provision --kms file", architecture §3.3): a directory of its own,
      # outside the web root and outside the sealed keys, shared for the same reason; the process that rotates
      # seals with it, the process that serves opens with it.
      - kms_data:/app/var/kms
      # The GeoLite2 databases of addresses (architecture §3.5): the console refreshes them here and the
      # worker below reads them, so they are one directory for both or a refresh asked for in this
      # container would change nothing where the enrichment runs.
      - geoip_data:/app/var/geoip
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp
    networks:
      default:
        aliases:
          - op.localhost
          # so that a container of the stack reaches the mTLS host the way a browser on the machine does
          - mtls.op.localhost
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    tty: true

  # The worker of architecture §5.6, one in development: the transports of the buses, the lane of what the
  # provider tells a third party (§4.9, the logout tokens) and the schedule of the bundle
  # ("scheduler_beffroi": the timed steps of the key lifecycle, §3.3). That lane is named first after the
  # schedule because a relying party learns of a logout while the certification suite waits for it, and
  # messenger:consume takes the transports in the order it is given them. One process consumes the
  # schedule; the buses could have more. Same image, no HTTP, restarted every hour by Messenger itself.
  worker:
    build:
      context: .
      dockerfile: apps/op/Dockerfile
      target: frankenphp_dev
    restart: unless-stopped
    # What this container needs from the machine around it before it consumes anything: the address of the
    # host, and the certificate of the conformance suite when the suite is up. Chained behind the
    # entrypoint of the image, which every container of it goes through.
    entrypoint: ["docker-entrypoint", "/bin/sh", "/entrypoint/entrypoint.sh"]
    command: ["scheduler_beffroi", "async_notifications", "async_priority_high", "async_priority_medium", "async_priority_low", "--time-limit=3600", "--memory-limit=256M"]
    # The image checks Caddy; a worker is healthy while the consumer is its first process. The entrypoint
    # runs before that process replaces it, and waits for the certificate of the conformance suite when
    # the suite is starting beside it: the window is wide enough for that wait, or "up --wait" would call
    # a worker that is still getting ready unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "grep -q messenger:consume /proc/1/cmdline"]
      start_period: 90s
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beffroi}:${POSTGRES_PASSWORD:-beffroi}@database:5432/${POSTGRES_DB:-beffroi}?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-beffroi}:${RABBITMQ_PASSWORD:-beffroi}@rabbitmq:5672/%2f/messages
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      APP_PROFILER: 0
      CONFORMANCE_ACCESS_TOKEN_FORMAT: ${CONFORMANCE_ACCESS_TOKEN_FORMAT:-jwt}
      CONFORMANCE_NGINX_HOST: ${CONFORMANCE_NGINX_HOST:-}
    # The worker is what calls a client back: a logout token (Back-Channel Logout 1.0 §2.5) and the
    # notification that a backchannel request has been answered (CIBA Core §10.2). It is therefore the
    # one process of the stack that calls out to an application of the host. "localhost" is the
    # container itself from in here, so a client the worker has to reach is registered under a name of
    # its own, which resolves to the host: the second instance of oidc-demo ("castor demo
    # --logout-others") and the listener of the ping client ("castor demo --ciba").
    extra_hosts:
      - "demo.localhost:host-gateway"
    volumes:
      - ./docker/worker/entrypoint.sh:/entrypoint/entrypoint.sh:ro
      - ./docker/conformance/trust-nginx.sh:/entrypoint/trust-nginx.sh:ro
      - ./apps/op:/app
      - ./src:/src
      - /app/var/
      - keys_data:/app/var/keys
      - kms_data:/app/var/kms
      - geoip_data:/app/var/geoip
    depends_on:
      op:
        condition: service_healthy
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # HashiCorp Vault, the KMS of the spike (architecture §3.3): its Transit engine wraps the data key of every
  # envelope, the private JWK never reaches it. Dev mode, in memory: a restart loses the key of the tenant
  # and every token, and the envelopes sealed before it cannot be opened again. The container runs
  # docker/vault/init.sh against its own server on every start, idempotent: Transit enabled, the key of the
  # tenant beffroi-<slug> (derived, not exportable, without plaintext backup), the policy of the OP
  # (docker/vault/beffroi-op.hcl); it is healthy once the key exists. The root token stays here, for the
  # script and for "castor provision --kms vault", which mints the token of the OP under that policy.
  # (A separate one-shot init service would make "docker compose up --wait" fail the moment it exits.)
  # The relying party of apps/rp ("castor rp"), on https://rp.localhost through the Caddy of op
  # (docker/rp/rp.Caddyfile). The image of op for its PHP and its Composer and nothing else of it: not its
  # entrypoint, which builds the stylesheet of the OP, and not its worker mode, so that an edit is served by
  # the next request and .env.local is read at each one. It calls https://op.localhost through the alias of
  # op and verifies it against the root of the internal CA of Caddy, read from the volume of op.
  rp:
    build:
      context: .
      dockerfile: apps/op/Dockerfile
      target: frankenphp_dev
    profiles: [rp]
    restart: unless-stopped
    entrypoint: ["docker-php-entrypoint"]
    command: ["sh", "-c", "[ -d vendor ] || composer install --prefer-dist --no-progress --no-interaction; exec frankenphp php-server --root /app/public --listen :80"]
    working_dir: /app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/ || exit 1"]
      start_period: 120s
    volumes:
      - ./apps/rp:/app
      - /app/var/
      - caddy_data:/caddy:ro
    depends_on:
      - op

  vault:
    image: hashicorp/vault:${VAULT_VERSION:-2.1}
    profiles: [vault]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN:-dev-root-token}
      BEFFROI_TENANT_SLUG: ${BEFFROI_TENANT_SLUG:-default}
    entrypoint: ["/bin/sh", "-c"]
    command: ["docker-entrypoint.sh server -dev & pid=$$!; trap 'kill $$pid' TERM INT; /init/init.sh; wait $$pid"]
    healthcheck:
      test: ["CMD", "vault", "read", "transit/keys/beffroi-${BEFFROI_TENANT_SLUG:-default}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "${VAULT_PORT:-8200}:8200"
    volumes:
      - ./docker/vault:/init:ro

  # AWS KMS on the desk (architecture §3.3, issue #58): LocalStack with the KMS service alone, the same bridge
  # and the same envelope as against AWS, only the endpoint differs (host "localstack", scheme http). The
  # version is the last one of the community edition, which LocalStack ended on 2026-03-23: every image
  # since (2026.x) refuses to start without an account and an auth token, and its free tier is for
  # non-commercial use. No persistence in this edition: a restart loses the key, and the envelopes sealed
  # before it cannot be opened again, which "castor provision" notices. LocalStack runs
  # docker/localstack/init.sh once it is ready, at every start, idempotent: the key of the tenant
  # (SYMMETRIC_DEFAULT, ENCRYPT_DECRYPT) under the alias beffroi-<slug>, which the DSN names; healthy once the
  # alias resolves. The credentials are the "test" pair LocalStack accepts, with no IAM in this edition:
  # what the key policy of a real account refuses is written in the CISO page, not proved here.
  localstack:
    image: localstack/localstack:${LOCALSTACK_VERSION:-4.14.0}
    profiles: [aws]
    environment:
      SERVICES: kms
      BEFFROI_TENANT_SLUG: ${BEFFROI_TENANT_SLUG:-default}
      # The region of the DSN "castor provision --kms aws" writes; the image sets its own default, which
      # the script and the healthcheck do not read.
      KMS_REGION: ${KMS_REGION:-eu-west-3}
    healthcheck:
      test: ["CMD-SHELL", "awslocal kms describe-key --region ${KMS_REGION:-eu-west-3} --key-id alias/beffroi-${BEFFROI_TENANT_SLUG:-default} >/dev/null"]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 15s
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./docker/localstack:/etc/localstack/init/ready.d:ro

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beffroi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beffroi}
      POSTGRES_USER: ${POSTGRES_USER:-beffroi}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-beffroi}", "-U", "${POSTGRES_USER:-beffroi}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    # Published on the loopback interface alone, for the suite of the application ("castor app-phpunit",
    # issue #521): that task runs in the QA image and is given the network of this machine, so what it
    # reaches here is this port, and on a runner it reads the service container beside the job at the name
    # that workflow sets DATABASE_URL to (.github/workflows/application.yml). It writes the database the
    # test environment of the application names, "<name>_test", and never the one this server serves to
    # the stack.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data:rw

  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION:-4}-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-beffroi}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-beffroi}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # OpenID Foundation conformance suite, prebuilt images from gitlab.com/openid/conformance-suite.
  # Test plan for spike 1: oidcc-basic-certification-test-plan (tests/conformance/).
  conformance-mongodb:
    image: mongo:6.0.13
    profiles: [conformance]
    networks:
      default:
        aliases:
          # The suite jar connects to "mongodb" whatever the property says
          - mongodb
    volumes:
      - conformance_mongo:/data/db

  conformance-server:
    image: registry.gitlab.com/openid/conformance-suite:${CONFORMANCE_SUITE_VERSION:-release-v5.2.1}
    profiles: [conformance]
    # Same environment as the official docker-compose-prebuilt.yml: the dev Spring profile needs no
    # login, but the OAuth registrations must be non-empty for the context to start.
    environment:
      BASE_URL: https://localhost:8443
      BASE_MTLS_URL: https://localhost:8444
      MONGODB_HOST: conformance-mongodb
      SPRING_PROFILES_ACTIVE: dev
      JAVA_EXTRA_ARGS: -Dfintechlabs.devmode=true
      OIDC_GOOGLE_CLIENTID: google-client
      OIDC_GOOGLE_SECRET: google-secret
      OIDC_GITLAB_CLIENTID: gitlab-client
      OIDC_GITLAB_SECRET: gitlab-secret
    entrypoint: ["/bin/sh", "/entrypoint/server-entrypoint.sh"]
    volumes:
      - ./tests/conformance/server-entrypoint.sh:/entrypoint/server-entrypoint.sh:ro
      - caddy_data:/caddy:ro
    networks:
      default:
        aliases:
          # The nginx image proxies to http://server:8080
          - server
    depends_on:
      - conformance-mongodb
      - op
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"

  conformance-nginx:
    image: registry.gitlab.com/openid/conformance-suite/nginx:${CONFORMANCE_NGINX_VERSION:-release-v5.2.0}
    profiles: [conformance]
    ports:
      - "8443:8443"
      - "8444:8444"
    depends_on:
      - conformance-server

  # The scripted browser of the suite runs inside the JVM of conformance-server and is redirected by the OP
  # to https://localhost:8443/test/a/<alias>/callback, the same URL a browser on the host reaches. Inside
  # that container, localhost is the container: this sidecar shares its network namespace and forwards the
  # loopback port 8443 to nginx. The suite does the same with "fintechlabs.startredir" and the redir binary,
  # which the prebuilt image does not ship.
  conformance-redirector:
    image: alpine/socat:${CONFORMANCE_SOCAT_VERSION:-1.8.0.3}
    profiles: [conformance]
    network_mode: "service:conformance-server"
    command: TCP-LISTEN:8443,fork,reuseaddr,bind=127.0.0.1 TCP:conformance-nginx:8443
    depends_on:
      - conformance-server
      - conformance-nginx

  # The logout token of the back-channel plan is posted by the worker to the URI the suite gives its
  # clients, which names localhost:8443; inside the worker that is the worker. This sidecar shares its
  # network namespace and forwards that loopback port to nginx, as conformance-redirector does for the
  # scripted browser of the suite. What answers there is the self-signed certificate of nginx, which the
  # entrypoint of the worker fetches and trusts (docker/worker/entrypoint.sh).
  conformance-worker-redirector:
    image: alpine/socat:${CONFORMANCE_SOCAT_VERSION:-1.8.0.3}
    profiles: [conformance]
    network_mode: "service:worker"
    command: TCP-LISTEN:8443,fork,reuseaddr,bind=127.0.0.1 TCP:conformance-nginx:8443
    depends_on:
      - worker
      - conformance-nginx

  # The document behind a "sector_identifier_uri" is read by the registration endpoint, in the op container
  # (OIDC Registration §5, issue #363), and the two modules of the Dynamic plan that judge it serve that
  # document from the suite itself, at an address naming localhost:8443. Inside the op container that is
  # the op container. This sidecar shares its network namespace and forwards that loopback port to nginx,
  # as the two above do for the scripted browser and for the worker. What answers there is the self-signed
  # certificate of nginx, which the entrypoint of the op container fetches and trusts
  # (docker/conformance/trust-nginx.sh).
  conformance-op-redirector:
    image: alpine/socat:${CONFORMANCE_SOCAT_VERSION:-1.8.0.3}
    profiles: [conformance]
    network_mode: "service:op"
    command: TCP-LISTEN:8443,fork,reuseaddr,bind=127.0.0.1 TCP:conformance-nginx:8443
    depends_on:
      - op
      - conformance-nginx

volumes:
  keys_data:
  kms_data:
  geoip_data:
  caddy_data:
  rabbitmq_data:
  caddy_config:
  database_data:
  conformance_mongo:
