    # the delivery of a logout token: the queue it waits in, and the handler called as the worker calls it
    test.beffroi.notification_queue:
        alias: messenger.transport.async_notifications
        public: true
    # What a pending approval is handed to as the worker hands it, and what the null transports of mail and SMS were
