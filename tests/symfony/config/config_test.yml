    App\Tests\Symfony\Functional\MessageHandler\RecordingEventHandler:
        autoconfigure: true
        public: true

    # A third shape of access token, wired as a deployment wires one: an issuer that names it, a verifier
    # that answers to the same name, and no line of src edited for the token endpoint to mint it and for
    # the UserInfo endpoint to read it back (issue #239). Behind the two the provider wires, because the
    # first wired shape is what a client that registers none takes, and the clients of this kernel that
    # register none expect the "at+jwt" the provider writes first.
    App\Tests\Symfony\Functional\Token\InventedAccessTokenIssuer:
        arguments: ['@Beffroi\Oidc\Application\Token\OpaqueAccessTokenIssuer']
        tags:
            - { name: beffroi.oidc.access_token_issuer, priority: -10 }
    App\Tests\Symfony\Functional\Token\InventedAccessTokenVerifier:
        arguments: ['@Beffroi\Oidc\Application\Token\OpaqueAccessTokenVerifier']
        tags:
            - { name: beffroi.oidc.access_token_verifier, priority: -10 }

    # A fifth way of answering the authorization endpoint, wired as a deployment wires one: it names itself,
    # and that name is what a request may ask for, what the document announces and what the endpoint answers
    # in, with no line of src edited (issue #240). Behind the four the provider wires, because the first wired
    # mode is what a request the provider cannot answer as it asked falls back to, and every other test of
    # this kernel expects that fallback to be the "query" of RFC 6749 §4.1.2.
    App\Tests\Symfony\Functional\ResponseMode\InventedResponseModeRenderer:
        tags:
            - { name: beffroi.response_mode, priority: -10 }

    # A missing translation fails the request rather than showing its key or its English (architecture §5.7).
    App\Tests\Symfony\Functional\Translation\StrictTranslator:
        decorates: translator
        arguments: ['@.inner']

    # The argon2id hashes of the suite at the smallest cost the algorithm accepts, ahead of the native hasher
    # of the core, which keeps its production cost and the hashes of the other algorithms: 400 ms a hash
    # otherwise, paid once per user, ten times per TOTP and once per client authentication after a reboot.
    App\Tests\Symfony\Functional\Security\CheapArgon2idHasher:
        tags:
            - { name: beffroi.password_hasher, priority: 10 }

    # The RSA keys of the suite at the 2048 bits RFC 7518 §3.3 requires rather than the 3072 the provider
    # generates: a key pair in 60 ms instead of 300, at every signingKey() and every rotation.
    Beffroi\Core\Bridge\JwtLibrary\Algorithm\RsaKeyBits:
        arguments:
            $value: 2048

    # Decisions 0011 and 0018: the third success criterion of the spike is a count of what the KMS was
    # asked, read in the log of the KMS when it is measured against a running stack ("castor login-cost").
    # Where there is no KMS on a network, the client the configuration names is decorated with one that
    # counts: one unwrap per data key and per process, and none per value.
    App\Tests\Symfony\Functional\Doctrine\PersonalData\CountingKms:
        decorates: beffroi_test.kms
        arguments: ['@.inner']
        public: true

# The service providers of the tenant of the tests, declared for the environment "test" alone (the YAML loader
# reads "when@<environment>"): an environment of its own that turns the identity provider off, as
# config_test_without_saml.yml does, adds to this file and cannot take a declaration out of it, and the
# configuration refuses service providers for a tenant that is no identity provider (spec/saml.md section 5.2).
when@test:
    beffroi:
        saml:
            # A SimpleSAMLphp service provider (spec/saml.md section 5.2): its metadata read from a file the tests
            # write in the cache directory of the kernel, the one of their worker, by
            # "beffroi:saml:service-provider:refresh"; its assertions encrypted, its metadata holding a key for it.
            service_providers:
                'https://localhost:8082/simplesaml/module.php/saml/sp/metadata/default-sp':
                    metadata: '%kernel.cache_dir%/saml/simplesamlphp-sp-metadata.xml'
                    attributes:
                        'urn:oid:0.9.2342.19200300.100.1.3':
                            claim: email
                            friendly_name: mail
                    encrypt_assertions: true
                # The service provider of single sign-on (spec/saml.md section 6.4): its metadata a file of the suite, which
                # publishes the test key of a service provider of saml2-model, the key its requests are signed with; two
                # claims of the provider sent under their OID names.
                'https://sp.example.org/saml':
                    metadata: '%kernel.project_dir%/../saml/Fixture/metadata/sp-example-org-metadata.xml'
                    attributes:
                        'urn:oid:0.9.2342.19200300.100.1.3':
                            claim: email
                            friendly_name: mail
                        'urn:oid:2.16.840.1.113730.3.1.241':
                            claim: name
                            friendly_name: displayName
                # Entra's SAML federation of guests (issue #736, spec/saml.md section 7): its metadata the ones an
                # administrator writes by hand, no key, its requests unsigned; the one claim it requires.
                'https://login.microsoftonline.com/aaaabbbb-0000-cccc-1111-dddd2222eeee/':
                    metadata: '%kernel.project_dir%/../saml/Fixture/metadata/entra-guest-federation-sp.xml'
                    signs_authn_requests: false
                    attributes:
                        'http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress':
                            claim: email
